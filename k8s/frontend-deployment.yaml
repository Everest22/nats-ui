apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: nats
  labels:
    app: custom-nats-ui
    component: custom-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: custom-nats-ui
      component: custom-frontend
  template:
    metadata:
      labels:
        app: custom-nats-ui
        component: custom-frontend
    spec:
      containers:
        - name: frontend
          image: <image_name>
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
      imagePullSecrets:
        - name: registry-secret
      volumes:
        - name: nginx-config
          configMap:
            name: frontend-nginx-config
