apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: nats
  labels:
    app: custom-nats-ui
    component: custom-frontend
spec:
  type: LoadBalancer
  selector:
    app: custom-nats-ui
    component: custom-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
