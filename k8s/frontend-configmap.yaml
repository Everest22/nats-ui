apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx-config
  namespace: nats
  labels:
    app: custom-nats-ui
    component: custom-frontend
data:
  default.conf: |
    server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;

        # Use kube-dns for lazy resolution at request time, not at nginx startup
        resolver kube-dns.kube-system.svc.cluster.local valid=30s ipv6=off;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            set $backend backend.nats.svc.cluster.local;
            proxy_pass http://$backend:8080;
            proxy_set_header Host $host;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            proxy_connect_timeout 10s;
            client_max_body_size 50m;
        }

        location /ws/ {
            set $backend backend.nats.svc.cluster.local;
            proxy_pass http://$backend:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
