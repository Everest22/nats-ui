apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: nats
  labels:
    app: custom-nats-ui
    component: custom-backend
spec:
  type: ClusterIP
  selector:
    app: custom-nats-ui
    component: custom-backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
